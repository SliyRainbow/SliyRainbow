name: Update profile statistics

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      preview_username:
        description: 'Optional public account preview; downloads only, does not commit'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: profile-statistics-${{ inputs.preview_username || github.repository_owner }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC_PROFILE_USER: ${{ inputs.preview_username || github.repository_owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Update public statistics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/update-stats.py --root . --username "$PUBLIC_PROFILE_USER"
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ env.PUBLIC_PROFILE_USER }}
          outputs: |
            assets/snake.svg?color_snake=#5c8ef5
            assets/snake-dark.svg?palette=github-dark&color_snake=#7aa2f7
      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USERNAME: ${{ env.PUBLIC_PROFILE_USER }}
      - name: Select day and night 3D artwork
        run: |
          cp profile-3d-contrib/profile-gitblock.svg assets/contributions-3d.svg
          cp profile-3d-contrib/profile-night-rainbow.svg assets/contributions-3d-dark.svg
      - name: Save generated images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profile-${{ env.PUBLIC_PROFILE_USER }}
          path: |
            assets/snake*.svg
            assets/contributions-3d*.svg
            assets/public-stats.json
          retention-days: 7
      - name: Commit refreshed statistics
        if: ${{ inputs.preview_username == '' && github.ref_name == github.event.repository.default_branch }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats*.svg assets/languages*.svg assets/streak*.svg assets/social*.svg assets/activity*.svg assets/snake*.svg assets/contributions-3d*.svg assets/public-stats.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh GitHub statistics, snake, and 3D calendar [skip ci]"
          git push
