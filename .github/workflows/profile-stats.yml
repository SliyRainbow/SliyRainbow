name: Update profile statistics

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Generate cards from public GitHub data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/update-stats.py --root .
      - name: Commit updated statistics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats*.svg assets/activity*.svg assets/languages*.svg assets/public-stats.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh public GitHub statistics [skip ci]"
          git push
